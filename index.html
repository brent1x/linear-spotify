<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Deck</title>
  <style>
    :root {
      --bg: #0e0e11;
      --card: #141418;
      --row: #101014;
      --border: #22222b;
      --border-hover: #333342;
      --text: #ededef;
      --sub: #8a8a9e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body {
      background: #08080a;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .shell {
      width: 100vw;
      height: 100vh;
      max-width: 400px;
      max-height: 300px;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: var(--bg);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 20px;
      text-align: center;
    }
    .hidden { display: none !important; }
    .overlay h2 { font-size: 13px; font-weight: 500; color: var(--text); }
    .overlay p { font-size: 11px; color: var(--sub); }
    .btn-primary {
      background: #ededef;
      color: #08080a;
      font-weight: 500;
      font-size: 11px;
      padding: 6px 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.85; }

    .now-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      gap: 10px;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding-bottom: 16px; /* Make room for progress bar & timer */
    }
    #cover {
      width: 52px;
      height: 52px;
      border-radius: 5px;
      background: #1c1c24;
      object-fit: cover;
      flex-shrink: 0;
    }
    .meta { flex: 1; min-width: 0; }
    .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 4px; }
    
    #title { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 190px; }
    #artist { font-size: 10px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

    .badges {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      flex-shrink: 0;
    }
    .badge {
      font-size: 9px;
      font-weight: 500;
      background: #1a1a22;
      color: var(--sub);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 115px;
    }

    .controls { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
    .ctrl-btn {
      background: transparent;
      color: var(--sub);
      border: 1px solid var(--border);
      border-radius: 4px;
      height: 22px;
      padding: 0 8px;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
    }
    .ctrl-btn:hover { background: #1a1a22; color: var(--text); border-color: var(--border-hover); }

    .util-btn {
      background: transparent;
      color: var(--sub);
      border: 1px solid transparent;
      padding: 0 5px;
      height: 20px;
      font-size: 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .util-btn:hover { color: var(--text); background: #1a1a22; }

    /* Spotify-style Progress Track & Timer */
    .progress-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 14px;
      display: flex;
      align-items: center;
    }
    .progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 76px; /* Room for current/total MM:SS timer */
      height: 4px;
      background: #1a1a22;
      cursor: pointer;
    }
    .progress-track:hover { height: 6px; }
    #progress {
      height: 100%;
      width: 0%;
      background: #ededef;
      pointer-events: none;
      transition: width 0.1s linear;
    }
    #timeDisplay {
      position: absolute;
      right: 6px;
      bottom: 2px;
      font-size: 9px;
      color: var(--sub);
      font-variant-numeric: tabular-nums;
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--sub);
      padding: 0 2px;
    }
    #queue {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 2px;
    }
    .q-item {
      background: var(--row);
      border: 1px solid #17171d;
      border-radius: 5px;
      padding: 4px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      height: 27px;
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .q-item:hover { background: #1a1a24; border-color: var(--border-hover); }
    .q-left { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; padding-right: 8px; }
    .q-num { color: var(--sub); font-size: 9px; width: 10px; }
    .q-name { font-weight: 400; color: #dedee2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q-artist { color: var(--sub); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 115px; flex-shrink: 0; }
  </style>
</head>
<body>

  <div class="shell">
    <div id="loginScreen" class="overlay hidden">
      <h2>Connect Spotify</h2>
      <p>Authorize session to sync player control.</p>
      <button class="btn-primary" onclick="startSpotifyAuth()">Connect</button>
    </div>

    <div class="now-card">
      <img id="cover" src="" alt="" />
      <div class="meta">
        <div class="top-row">
          <div>
            <div id="title">Idle</div>
            <div id="artist">Waiting for playback</div>
          </div>
          <div class="badges">
            <div id="devicePill" class="badge" title="Active Device">Device</div>
            <div id="playlistPill" class="badge" title="Active Playlist">Playlist: —</div>
          </div>
        </div>
        <div class="controls">
          <button id="playBtn" class="ctrl-btn" onclick="togglePlay()" title="Play/Pause">Play</button>
          <button class="ctrl-btn" onclick="skipTrack()" title="Next">Next</button>
          <div style="margin-left:auto; display:flex; gap:2px;">
            <button id="popBtn" class="util-btn" onclick="popOut()" title="Pop out">↗</button>
          </div>
        </div>
      </div>
      <div class="progress-container">
        <div class="progress-track" id="progressTrack" onclick="scrubTrack(event)">
          <div id="progress"></div>
        </div>
        <div id="timeDisplay">0:00 / 0:00</div>
      </div>
    </div>

    <div class="q-header">
      <span>Up Next (Click to Play)</span>
      <span>Queue</span>
    </div>
    <div id="queue"></div>
  </div>

  <script>
    const CONFIG = {
      SPOTIFY_CLIENT_ID: "88d726c655c9441c8731d2eeddc9c8cb"
    };

    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const SCOPES = "user-read-currently-playing user-read-playback-state user-modify-playback-state";
    let isPlaying = false;
    let trackDuration = 0;
    let currentProgress = 0;
    let lastTrackData = null;
    let cachedQueue = null;

    if (window.innerWidth <= 420 && window.innerHeight <= 340) {
      document.getElementById("popBtn").classList.add("hidden");
    }

    function formatTime(ms) {
      const totalSeconds = Math.floor(ms / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
    }

    function randomString(len) {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      return Array.from(crypto.getRandomValues(new Uint8Array(len)), x => chars[x % chars.length]).join("");
    }

    async function sha256Base64Url(plain) {
      const data = new TextEncoder().encode(plain);
      const hash = await crypto.subtle.digest("SHA-256", data);
      return btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/=/g, "").replace(/\+/g, "-").replace(/\//g, "_");
    }

    async function startSpotifyAuth() {
      const verifier = randomString(64);
      localStorage.setItem("sp_verifier", verifier);
      const challenge = await sha256Base64Url(verifier);

      const params = new URLSearchParams({
        client_id: CONFIG.SPOTIFY_CLIENT_ID,
        response_type: "code",
        redirect_uri: REDIRECT_URI,
        scope: SCOPES,
        code_challenge_method: "S256",
        code_challenge: challenge
      });
      window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
    }

    async function exchangeCode(code) {
      const verifier = localStorage.getItem("sp_verifier");
      const res = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          client_id: CONFIG.SPOTIFY_CLIENT_ID,
          grant_type: "authorization_code",
          code,
          redirect_uri: REDIRECT_URI,
          code_verifier: verifier
        })
      });
      const data = await res.json();
      if (data.access_token) saveTokens(data);
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    async function refreshTokenIfNeeded() {
      const expiresAt = Number(localStorage.getItem("sp_expires") || 0);
      const refresh = localStorage.getItem("sp_refresh");
      if (Date.now() < expiresAt) return localStorage.getItem("sp_token");
      if (!refresh) return null;

      const res = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          client_id: CONFIG.SPOTIFY_CLIENT_ID,
          grant_type: "refresh_token",
          refresh_token: refresh
        })
      });
      const data = await res.json();
      if (data.access_token) {
        saveTokens(data);
        return data.access_token;
      }
      return null;
    }

    function saveTokens(data) {
      localStorage.setItem("sp_token", data.access_token);
      if (data.refresh_token) localStorage.setItem("sp_refresh", data.refresh_token);
      localStorage.setItem("sp_expires", String(Date.now() + (data.expires_in - 60) * 1000));
    }

    async function spFetch(endpoint, method = "GET") {
      const token = await refreshTokenIfNeeded();
      if (!token) {
        document.getElementById("loginScreen").classList.remove("hidden");
        return null;
      }
      const res = await fetch(`https://api.spotify.com/v1/me/player${endpoint}`, {
        method,
        headers: { Authorization: `Bearer ${token}` }
      });
      if (res.status === 204 || res.status === 202) return null;
      return res.ok ? res.json() : null;
    }

    async function syncDeck() {
      const [player, qData] = await Promise.all([spFetch(""), spFetch("/queue")]);

      if (player) {
        if (player.device && player.device.name) {
          document.getElementById("devicePill").textContent = player.device.name;
        }
        if (player.item) {
          lastTrackData = player;
        }
      }

      if (qData && qData.queue) {
        cachedQueue = qData.queue;
      }

      const activePlayer = (player && player.item) ? player : lastTrackData;

      if (activePlayer && activePlayer.item) {
        isPlaying = activePlayer.is_playing;
        trackDuration = activePlayer.item.duration_ms;
        currentProgress = activePlayer.progress_ms || 0;

        document.getElementById("title").textContent = activePlayer.item.name;
        document.getElementById("artist").textContent = activePlayer.item.artists.map(a => a.name).join(", ");
        document.getElementById("cover").src = activePlayer.item.album.images[0]?.url || "";
        document.getElementById("playBtn").textContent = isPlaying ? "Pause" : "Play";
        
        const pct = Math.min(100, (currentProgress / trackDuration) * 100);
        document.getElementById("progress").style.width = `${pct}%`;
        document.getElementById("timeDisplay").textContent = `${formatTime(currentProgress)} / ${formatTime(trackDuration)}`;

        if (activePlayer.context && activePlayer.context.uri) {
          const uriParts = activePlayer.context.uri.split(":");
          const contextType = uriParts[1];
          const contextId = uriParts[2];

          if (contextType === "playlist" && contextId) {
            fetchPlaylistName(contextId);
          } else if (contextType === "album" && activePlayer.item.album) {
            document.getElementById("playlistPill").textContent = activePlayer.item.album.name;
          } else if (contextType === "artist") {
            document.getElementById("playlistPill").textContent = "Artist Radio";
          } else {
            document.getElementById("playlistPill").textContent = contextType.charAt(0).toUpperCase() + contextType.slice(1);
          }
        } else if (activePlayer.item.album) {
          document.getElementById("playlistPill").textContent = activePlayer.item.album.name;
        } else {
          document.getElementById("playlistPill").textContent = "Queue";
        }
      }

      const queueToRender = qData?.queue || cachedQueue;
      if (queueToRender) {
        const next5 = queueToRender.slice(0, 5);
        document.getElementById("queue").innerHTML = next5.map((t, i) => `
          <div class="q-item" onclick="playQueueTrack('${t.uri}')" title="Click to play">
            <div class="q-left">
              <span class="q-num">${i + 1}</span>
              <span class="q-name">${t.name}</span>
            </div>
            <span class="q-artist">${t.artists[0]?.name || ""}</span>
          </div>
        `).join("");
      }
    }

    async function fetchPlaylistName(playlistId) {
      const token = await refreshTokenIfNeeded();
      if (!token) return;
      try {
        const res = await fetch(`https://api.spotify.com/v1/playlists/${playlistId}?fields=name`, {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (res.ok) {
          const data = await res.json();
          if (data.name) {
            document.getElementById("playlistPill").textContent = data.name;
          }
        }
      } catch (e) {
        // Fallback silently
      }
    }

    async function togglePlay() {
      await spFetch(isPlaying ? "/pause" : "/play", "PUT");
      setTimeout(syncDeck, 300);
    }

    async function skipTrack() {
      const token = await refreshTokenIfNeeded();
      if (!token) return;
      await fetch("https://api.spotify.com/v1/me/player/next", {
        method: "POST",
        headers: { Authorization: `Bearer ${token}` }
      });
      setTimeout(syncDeck, 400);
    }

    async function playQueueTrack(trackUri) {
      const token = await refreshTokenIfNeeded();
      if (!token) return;
      await fetch("https://api.spotify.com/v1/me/player/play", {
        method: "PUT",
        headers: { 
          Authorization: `Bearer ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ uris: [trackUri] })
      });
      setTimeout(syncDeck, 400);
    }

    async function scrubTrack(event) {
      if (!trackDuration) return;
      const rect = document.getElementById("progressTrack").getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const width = rect.width;
      const percent = Math.max(0, Math.min(1, clickX / width));
      const targetMs = Math.floor(trackDuration * percent);

      if (lastTrackData) lastTrackData.progress_ms = targetMs;
      document.getElementById("progress").style.width = `${percent * 100}%`;
      document.getElementById("timeDisplay").textContent = `${formatTime(targetMs)} / ${formatTime(trackDuration)}`;

      const token = await refreshTokenIfNeeded();
      if (!token) return;
      await fetch(`https://api.spotify.com/v1/me/player/seek?position_ms=${targetMs}`, {
        method: "PUT",
        headers: { Authorization: `Bearer ${token}` }
      });
      setTimeout(syncDeck, 200);
    }

    function popOut() {
      window.open(location.href, "SpotifyMiniDeck", "width=400,height=300,menubar=no,toolbar=no,location=no,status=no,resizable=no");
    }

    async function bootSpotify() {
      const params = new URLSearchParams(window.location.search);
      if (params.has("code")) {
        await exchangeCode(params.get("code"));
      }
      const token = await refreshTokenIfNeeded();
      if (!token) {
        document.getElementById("loginScreen").classList.remove("hidden");
      } else {
        document.getElementById("loginScreen").classList.add("hidden");
        syncDeck();
        setInterval(syncDeck, 3000);
      }
    }

    bootSpotify();
  </script>
</body>
</html>
