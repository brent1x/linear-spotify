<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Deck</title>
  <style>
    :root {
      --bg: #0e0e11;
      --card: #141418;
      --row: #101014;
      --border: #22222b;
      --border-hover: #333342;
      --text: #ededef;
      --sub: #8a8a9e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body {
      background: #08080a;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .shell {
      width: 100vw;
      height: 100vh;
      max-width: 400px;
      max-height: 300px;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: var(--bg);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 20px;
      text-align: center;
    }
    .hidden { display: none !important; }
    .overlay h2 { font-size: 13px; font-weight: 500; color: var(--text); }
    .overlay p { font-size: 11px; color: var(--sub); }
    .pin-input {
      background: var(--card);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 5px;
      font-size: 12px;
      text-align: center;
      width: 150px;
      outline: none;
    }
    .pin-input:focus { border-color: var(--border-hover); }
    .btn-primary {
      background: #ededef;
      color: #08080a;
      font-weight: 500;
      font-size: 11px;
      padding: 6px 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.85; }

    .now-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      gap: 10px;
      align-items: center;
      position: relative;
      overflow: hidden;
    }
    #cover {
      width: 52px;
      height: 52px;
      border-radius: 5px;
      background: #1c1c24;
      object-fit: cover;
      flex-shrink: 0;
    }
    .meta { flex: 1; min-width: 0; }
    .top-row { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
    #title { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #artist { font-size: 10px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }

    .controls { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
    .ctrl-btn {
      background: transparent;
      color: var(--sub);
      border: 1px solid var(--border);
      border-radius: 4px;
      height: 22px;
      padding: 0 8px;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
    }
    .ctrl-btn:hover { background: #1a1a22; color: var(--text); border-color: var(--border-hover); }
    .util-btn {
      background: transparent;
      color: var(--sub);
      border: 1px solid transparent;
      padding: 0 5px;
      height: 20px;
      font-size: 10px;
      border-radius: 4px;
      cursor: pointer;
    }
    .util-btn:hover { color: var(--text); background: #1a1a22; }

    .progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: #1a1a22;
      cursor: pointer;
    }
    .progress-track:hover { height: 6px; }
    #progress {
      height: 100%;
      width: 0%;
      background: #ededef;
      pointer-events: none;
      transition: width 0.1s linear;
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--sub);
      padding: 0 2px;
    }
    #queue {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 2px;
    }
    .q-item {
      background: var(--row);
      border: 1px solid #17171d;
      border-radius: 5px;
      padding: 4px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      height: 27px;
    }
    .q-left { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; padding-right: 8px; }
    .q-num { color: var(--sub); font-size: 9px; width: 10px; }
    .q-name { font-weight: 400; color: #dedee2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q-artist { color: var(--sub); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 115px; flex-shrink: 0; }
  </style>
</head>
<body>

  <div class="shell">
    <div id="lockScreen" class="overlay">
      <h2>Enter Passcode</h2>
      <form onsubmit="unlockApp(event)" style="display:flex; gap:6px;">
        <input id="pinInput" type="password" class="pin-input" placeholder="••••••••" autofocus />
        <button type="submit" class="btn-primary">Enter</button>
      </form>
      <p id="lockErr" style="color:#e5534b; font-size:10px;"></p>
    </div>

    <div id="loginScreen" class="overlay hidden">
      <h2>Connect Spotify</h2>
      <p>Authorize session to sync player control.</p>
      <button class="btn-primary" onclick="startSpotifyAuth()">Connect</button>
    </div>

    <div class="now-card">
      <img id="cover" src="" alt="" />
      <div class="meta">
        <div class="top-row">
          <div id="title">Idle</div>
        </div>
        <div id="artist">Waiting for playback</div>
        <div class="controls">
          <button class="ctrl-btn" onclick="command('POST', 'previous')" title="Previous">Prev</button>
          <button id="playBtn" class="ctrl-btn" onclick="togglePlay()" title="Play/Pause">Play</button>
          <button class="ctrl-btn" onclick="command('POST', 'next')" title="Next">Next</button>
          <div style="margin-left:auto; display:flex; gap:2px;">
            <button id="popBtn" class="util-btn" onclick="popOut()" title="Pop out">↗</button>
            <button class="util-btn" onclick="lockApp()" title="Lock">Lock</button>
          </div>
        </div>
      </div>
      <div class="progress-track" id="progressTrack" onclick="scrubTrack(event)">
        <div id="progress"></div>
      </div>
    </div>

    <div class="q-header">
      <span>Up Next</span>
      <span>Queue</span>
    </div>
    <div id="queue"></div>
  </div>

  <script>
    const CONFIG = {
      SPOTIFY_CLIENT_ID: "88d726c655c9441c8731d2eeddc9c8cb",
      // Pre-hashed SHA-256 for "snozzspot" (plaintext is completely hidden)
      PASSCODE_HASH: "0495f59040854cb6c5c7d2426dfc56db322cb2ae8e7a0494480efce263be6b2e"
    };

    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const SCOPES = "user-read-currently-playing user-read-playback-state user-modify-playback-state";
    let isPlaying = false;
    let trackDuration = 0;

    if (window.innerWidth <= 420 && window.innerHeight <= 340) {
      document.getElementById("popBtn").classList.add("hidden");
    }

    async function hashString(str) {
      const data = new TextEncoder().encode(str);
      const hashBuffer = await crypto.subtle.digest("SHA-256", data);
      return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    async function unlockApp(e) {
      e.preventDefault();
      const val = document.getElementById("pinInput").value;
      const hashedInput = await hashString(val);
      if (hashedInput === CONFIG.PASSCODE_HASH) {
        localStorage.setItem("deck_unlocked", "true");
        document.getElementById("lockScreen").classList.add("hidden");
        bootSpotify();
      } else {
        document.getElementById("lockErr").textContent = "Incorrect passcode";
      }
    }

    function lockApp() {
      localStorage.clear();
      location.reload();
    }

    function randomString(len) {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      return Array.from(crypto.getRandomValues(new Uint8Array(len)), x => chars[x % chars.length]).join("");
    }

    async function sha256Base64Url(plain) {
      const data = new TextEncoder().encode(plain);
      const hash = await crypto.subtle.digest("SHA-256", data);
      return btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/=/g, "").replace(/\+/g, "-").replace(/\//g, "_");
    }

    async function startSpotifyAuth() {
      const verifier = randomString(64);
      localStorage.setItem("sp_verifier", verifier);
      const challenge = await sha256Base64Url(verifier);

      const params = new URLSearchParams({
        client_id: CONFIG.SPOTIFY_CLIENT_ID,
        response_type: "code",
        redirect_uri: REDIRECT_URI,
        scope: SCOPES,
        code_challenge_method: "S256",
        code_challenge: challenge
      });
      window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
    }

    async function exchangeCode(code) {
      const verifier = localStorage.getItem("sp_verifier");
      const res = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          client_id: CONFIG.SPOTIFY_CLIENT_ID,
          grant_type: "authorization_code",
          code,
          redirect_uri: REDIRECT_URI,
          code_verifier: verifier
        })
      });
      const data = await res.json();
      if (data.access_token) saveTokens(data);
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    async function refreshTokenIfNeeded() {
      const expiresAt = Number(localStorage.getItem("sp_expires") || 0);
      const refresh = localStorage.getItem("sp_refresh");
      if (Date.now() < expiresAt) return localStorage.getItem("sp_token");
      if (!refresh) return null;

      const res = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          client_id: CONFIG.SPOTIFY_CLIENT_ID,
          grant_type: "refresh_token",
          refresh_token: refresh
        })
      });
      const data = await res.json();
      if (data.access_token) {
        saveTokens(data);
        return data.access_token;
      }
      return null;
    }

    function saveTokens(data) {
      localStorage.setItem("sp_token", data.access_token);
      if (data.refresh_token) localStorage.setItem("sp_refresh", data.refresh_token);
      localStorage.setItem("sp_expires", String(Date.now() + (data.expires_in - 60) * 1000));
    }

    async function spFetch(endpoint, method = "GET") {
      const token = await refreshTokenIfNeeded();
      if (!token) {
        document.getElementById("loginScreen").classList.remove("hidden");
        return null;
      }
      const res = await fetch(`https://api.spotify.com/v1/me/player${endpoint}`, {
        method,
        headers: { Authorization: `Bearer ${token}` }
      });
      if (res.status === 204 || res.status === 202) return null;
      return res.ok ? res.json() : null;
    }

    async function syncDeck() {
      if (localStorage.getItem("deck_unlocked") !== "true") return;
      const [player, qData] = await Promise.all([spFetch(""), spFetch("/queue")]);

      if (player && player.item) {
        isPlaying = player.is_playing;
        trackDuration = player.item.duration_ms;
        document.getElementById("title").textContent = player.item.name;
        document.getElementById("artist").textContent = player.item.artists.map(a => a.name).join(", ");
        document.getElementById("cover").src = player.item.album.images[0]?.url || "";
        document.getElementById("playBtn").textContent = isPlaying ? "Pause" : "Play";
        const pct = Math.min(100, ((player.progress_ms || 0) / trackDuration) * 100);
        document.getElementById("progress").style.width = `${pct}%`;
      }

      if (qData && qData.queue) {
        const next5 = qData.queue.slice(0, 5);
        document.getElementById("queue").innerHTML = next5.map((t, i) => `
          <div class="q-item">
            <div class="q-left">
              <span class="q-num">${i + 1}</span>
              <span class="q-name">${t.name}</span>
            </div>
            <span class="q-artist">${t.artists[0]?.name || ""}</span>
          </div>
        `).join("");
      }
    }

    async function togglePlay() {
      await spFetch(isPlaying ? "/pause" : "/play", "PUT");
      setTimeout(syncDeck, 300);
    }

    async function command(method, action) {
      await spFetch(`/${action}`, method);
      setTimeout(syncDeck, 350);
    }

    async function scrubTrack(event) {
      if (!trackDuration) return;
      const rect = document.getElementById("progressTrack").getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const width = rect.width;
      const percent = Math.max(0, Math.min(1, clickX / width));
      const targetMs = Math.floor(trackDuration * percent);

      const token = await refreshTokenIfNeeded();
      if (!token) return;
      await fetch(`https://api.spotify.com/v1/me/player/seek?position_ms=${targetMs}`, {
        method: "PUT",
        headers: { Authorization: `Bearer ${token}` }
      });
      setTimeout(syncDeck, 200);
    }

    function popOut() {
      window.open(location.href, "SpotifyMiniDeck", "width=400,height=300,menubar=no,toolbar=no,location=no,status=no,resizable=no");
    }

    async function bootSpotify() {
      const params = new URLSearchParams(window.location.search);
      if (params.has("code")) {
        await exchangeCode(params.get("code"));
      }
      const token = await refreshTokenIfNeeded();
      if (!token) {
        document.getElementById("loginScreen").classList.remove("hidden");
      } else {
        document.getElementById("loginScreen").classList.add("hidden");
        syncDeck();
        setInterval(syncDeck, 3000);
      }
    }

    if (localStorage.getItem("deck_unlocked") === "true") {
      document.getElementById("lockScreen").classList.add("hidden");
      bootSpotify();
    }
  </script>
</body>
</html>
