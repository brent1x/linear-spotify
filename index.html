<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Controller</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <style>
    :root {
      --bg: #0e0e11;
      --card: #141418;
      --row: #101014;
      --border: #22222b;
      --border-hover: #333342;
      --text: #ededef;
      --sub: #8a8a9e;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; user-select: none; }
    body {
      background: #08080a;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .shell {
      width: 100vw;
      height: 100vh;
      max-width: 400px;
      max-height: 300px;
      background: var(--bg);
      border: 1px solid var(--border);
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: var(--bg);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 20px;
      text-align: center;
    }
    .hidden { display: none !important; }
    .overlay h2 { font-size: 13px; font-weight: 500; color: var(--text); }
    .overlay p { font-size: 11px; color: var(--sub); }
    .btn-primary {
      background: #ededef;
      color: #08080a;
      font-weight: 500;
      font-size: 11px;
      padding: 6px 14px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .btn-primary:hover { opacity: 0.85; }

    .now-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px;
      display: flex;
      gap: 10px;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding-bottom: 16px;
    }
    #cover {
      width: 52px;
      height: 52px;
      border-radius: 5px;
      background: #1c1c24;
      object-fit: cover;
      flex-shrink: 0;
    }
    .meta { flex: 1; min-width: 0; }
    .top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 6px; }
    
    #title { font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }
    #artist { font-size: 10px; color: var(--sub); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; max-width: 170px; }

    .badges {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 3px;
      flex-shrink: 0;
    }
    .top-pill-row {
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .badge {
      font-size: 9px;
      font-weight: 500;
      background: #1a1a22;
      color: var(--sub);
      border: 1px solid var(--border);
      padding: 1px 6px;
      border-radius: 10px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 125px;
    }
    .pop-pill {
      font-size: 9px;
      background: #1a1a22;
      color: var(--sub);
      border: 1px solid var(--border);
      padding: 1px 5px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pop-pill:hover { color: var(--text); border-color: var(--border-hover); }

    .controls { display: flex; align-items: center; gap: 4px; margin-top: 6px; }
    .ctrl-btn {
      background: transparent;
      color: var(--sub);
      border: 1px solid var(--border);
      border-radius: 4px;
      height: 22px;
      padding: 0 8px;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.1s ease;
    }
    .ctrl-btn:hover { background: #1a1a22; color: var(--text); border-color: var(--border-hover); }

    .progress-container {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 14px;
      display: flex;
      align-items: center;
    }
    .progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 76px;
      height: 4px;
      background: #1a1a22;
      cursor: pointer;
    }
    .progress-track:hover { height: 6px; }
    #progress {
      height: 100%;
      width: 0%;
      background: #ededef;
      pointer-events: none;
      transition: width 0.1s linear;
    }
    #timeDisplay {
      position: absolute;
      right: 6px;
      bottom: 2px;
      font-size: 9px;
      color: var(--sub);
      font-variant-numeric: tabular-nums;
    }

    .q-header {
      display: flex;
      justify-content: space-between;
      font-size: 9px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--sub);
      padding: 0 2px;
    }
    #queue {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 2px;
    }
    .q-item {
      background: var(--row);
      border: 1px solid #17171d;
      border-radius: 5px;
      padding: 4px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      height: 27px;
      cursor: pointer;
      transition: background 0.1s ease;
    }
    .q-item:hover { background: #1a1a24; border-color: var(--border-hover); }
    .q-left { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1; padding-right: 8px; }
    .q-num { color: var(--sub); font-size: 9px; width: 10px; }
    .q-name { font-weight: 400; color: #dedee2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .q-artist { color: var(--sub); font-size: 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 115px; flex-shrink: 0; }
  </style>
</head>
<body>

  <div class="shell">
    <div id="loginScreen" class="overlay hidden">
      <h2>Connect Spotify</h2>
      <p>Authorize session to sync player & playlist names.</p>
      <button class="btn-primary" onclick="startSpotifyAuth()">Connect</button>
    </div>

    <div class="now-card">
      <img id="cover" alt="Cover" />
      <div class="meta">
        <div class="top-row">
          <div>
            <div id="title">Idle</div>
            <div id="artist">Waiting for playback</div>
          </div>
          <div class="badges">
            <div class="top-pill-row">
              <div id="devicePill" class="badge" title="Active Device">Device</div>
              <button id="popBtn" class="pop-pill" onclick="popOut()" title="Pop out">↗</button>
            </div>
            <div id="playlistPill" class="badge" title="Active Playlist / Context">Spotify</div>
          </div>
        </div>
        <div class="controls">
          <button id="playBtn" class="ctrl-btn" onclick="togglePlay()" title="Play/Pause">Play</button>
          <button class="ctrl-btn" onclick="skipTrack()" title="Next">Next</button>
        </div>
      </div>
      <div class="progress-container">
        <div class="progress-track" id="progressTrack" onclick="scrubTrack(event)">
          <div id="progress"></div>
        </div>
        <div id="timeDisplay">0:00 / 0:00</div>
      </div>
    </div>

    <div class="q-header">
      <span>Up Next (Click to Play)</span>
      <span>Queue</span>
    </div>
    <div id="queue"></div>
  </div>

  <script>
    const CONFIG = {
      SPOTIFY_CLIENT_ID: "88d726c655c9441c8731d2eeddc9c8cb",
      // Bumping AUTH_VERSION forces a one-time re-login so your token gets playlist-read permissions
      AUTH_VERSION: "3"
    };

    const SPOTIFY_LOGO_SVG = "data:image/svg+xml;utf8," + encodeURIComponent(`
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="52" height="52">
        <rect width="64" height="64" rx="6" fill="#1c1c24"/>
        <path fill="#1db954" d="M32 14C22.06 14 14 22.06 14 32s8.06 18 18 18 18-8.06 18-18-8.06-18-18-18zm8.26 25.98c-.32.53-1.01.7-1.54.37-4.23-2.58-9.55-3.17-15.82-1.74-.6.14-1.2-.24-1.34-.84-.14-.6.24-1.2.84-1.34 6.86-1.57 12.74-.9 17.49 2 .53.33.7 1.02.37 1.55zm2.2-4.9c-.41.67-1.29.88-1.96.47-4.84-2.98-12.22-3.84-17.95-2.1-.75.23-1.55-.2-1.78-.95-.23-.75.2-1.55.95-1.78 6.55-1.99 14.68-1.03 20.27 2.4.67.41.88 1.29.47 1.96zm.19-5.11c-5.8-3.45-15.38-3.77-20.92-2.09-.89.27-1.83-.23-2.1-.12-.27-.89.23-1.83 1.12-2.1 6.36-1.93 16.94-1.56 23.63 2.41.8.47 1.06 1.51.59 2.31-.47.8-1.51 1.06-2.32.59z"/>
      </svg>
    `);

    const REDIRECT_URI = window.location.origin + window.location.pathname;
    const SCOPES = [
      "user-read-currently-playing",
      "user-read-playback-state",
      "user-modify-playback-state",
      "playlist-read-private",
      "playlist-read-collaborative"
    ].join(" ");

    // Clear stale token if it was created before playlist scopes were added
    if (localStorage.getItem("sp_auth_version") !== CONFIG.AUTH_VERSION) {
      localStorage.removeItem("sp_token");
      localStorage.removeItem("sp_refresh");
      localStorage.removeItem("sp_expires");
      localStorage.setItem("sp_auth_version", CONFIG.AUTH_VERSION);
    }

    let isPlaying = false;
    let trackDuration = 0;
    let currentProgress = 0;
    let lastTrackData = JSON.parse(localStorage.getItem("sp_last_track") || "null");
    let cachedQueue = JSON.parse(localStorage.getItem("sp_cached_queue") || "null");
    let lastDeviceId = localStorage.getItem("sp_last_device_id") || null;
    let lastDeviceName = localStorage.getItem("sp_last_device_name") || "Device";
    let lastContextUri = localStorage.getItem("sp_last_context_uri") || null;
    let lastPlaylistLabel = localStorage.getItem("sp_last_playlist_label") || "";
    const playlistNameCache = JSON.parse(localStorage.getItem("sp_playlist_map") || "{}");

    document.getElementById("cover").src = SPOTIFY_LOGO_SVG;
    if (lastPlaylistLabel) {
      document.getElementById("playlistPill").textContent = lastPlaylistLabel;
    }

    if (window.innerWidth <= 420 && window.innerHeight <= 340) {
      document.getElementById("popBtn").classList.add("hidden");
    }

    function setPlaylistPill(name) {
      if (!name) return;
      lastPlaylistLabel = name;
      localStorage.setItem("sp_last_playlist_label", name);
      document.getElementById("playlistPill").textContent = name;
      document.getElementById("playlistPill").title = name;
    }

    function formatTime(ms) {
      const totalSeconds = Math.floor((ms || 0) / 1000);
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${minutes}:${seconds < 10 ? '0' : ''}${seconds}`;
    }

    function randomString(len) {
      const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
      return Array.from(crypto.getRandomValues(new Uint8Array(len)), x => chars[x % chars.length]).join("");
    }

    async function sha256Base64Url(plain) {
      const data = new TextEncoder().encode(plain);
      const hash = await crypto.subtle.digest("SHA-256", data);
      return btoa(String.fromCharCode(...new Uint8Array(hash))).replace(/=/g, "").replace(/\+/g, "-").replace(/\//g, "_");
    }

    async function startSpotifyAuth() {
      const verifier = randomString(64);
      localStorage.setItem("sp_verifier", verifier);
      const challenge = await sha256Base64Url(verifier);

      const params = new URLSearchParams({
        client_id: CONFIG.SPOTIFY_CLIENT_ID,
        response_type: "code",
        redirect_uri: REDIRECT_URI,
        scope: SCOPES,
        code_challenge_method: "S256",
        code_challenge: challenge
      });
      window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
    }

    async function exchangeCode(code) {
      const verifier = localStorage.getItem("sp_verifier");
      const res = await fetch("https://accounts.spotify.com/api/token", {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          client_id: CONFIG.SPOTIFY_CLIENT_ID,
          grant_type: "authorization_code",
          code,
          redirect_uri: REDIRECT_URI,
          code_verifier: verifier
        })
      });
      const data = await res.json();
      if (data.access_token) saveTokens(data);
      window.history.replaceState({}, document.title, window.location.pathname);
    }

    async function refreshTokenIfNeeded() {
      const expiresAt = Number(localStorage.getItem("sp_expires") || 0);
      const refresh = localStorage.getItem("sp_refresh");
      if (Date.now() < expiresAt) return localStorage.getItem("sp_token");
      if (!refresh) return null;

      try {
        const res = await fetch("https://accounts.spotify.com/api/token", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: new URLSearchParams({
            client_id: CONFIG.SPOTIFY_CLIENT_ID,
            grant_type: "refresh_token",
            refresh_token: refresh
          })
        });
        const data = await res.json();
        if (data.access_token) {
          saveTokens(data);
          return data.access_token;
        }
      } catch (e) {
        return localStorage.getItem("sp_token");
      }
      return null;
    }

    function saveTokens(data) {
      localStorage.setItem("sp_token", data.access_token);
      if (data.refresh_token) localStorage.setItem("sp_refresh", data.refresh_token);
      localStorage.setItem("sp_expires", String(Date.now() + (data.expires_in - 60) * 1000));
      localStorage.setItem("sp_auth_version", CONFIG.AUTH_VERSION);
    }

    async function spFetch(endpoint, method = "GET") {
      const token = await refreshTokenIfNeeded();
      if (!token) {
        document.getElementById("loginScreen").classList.remove("hidden");
        return null;
      }
      const res = await fetch(`https://api.spotify.com/v1/me/player${endpoint}`, {
        method,
        headers: { Authorization: `Bearer ${token}` }
      });
      if (res.status === 204 || res.status === 202) return null;
      return res.ok ? res.json() : null;
    }

    // Layer 1: Pre-index the user's saved & personal playlists on boot
    async function preloadUserPlaylists() {
      const token = await refreshTokenIfNeeded();
      if (!token) return;
      try {
        const res = await fetch("https://api.spotify.com/v1/me/playlists?limit=50", {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (res.ok) {
          const data = await res.json();
          (data.items || []).forEach(pl => {
            if (pl && pl.id && pl.name) {
              playlistNameCache[pl.id] = pl.name;
            }
          });
          localStorage.setItem("sp_playlist_map", JSON.stringify(playlistNameCache));
        }
      } catch (e) {}
    }

    // Layers 2 & 3: Direct API + oEmbed fallback for algorithmic/Made-For-You playlists
    async function resolvePlaylistName(playlistId, contextHref, fallbackAlbum) {
      if (playlistNameCache[playlistId]) {
        setPlaylistPill(playlistNameCache[playlistId]);
        return;
      }

      const token = await refreshTokenIfNeeded();

      // Layer 2: Direct Spotify Web API lookup (now works with playlist-read-private scope)
      if (token) {
        try {
          const apiUrl = contextHref || `https://api.spotify.com/v1/playlists/${playlistId}`;
          const res = await fetch(`${apiUrl}?fields=name`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.name) {
              playlistNameCache[playlistId] = data.name;
              localStorage.setItem("sp_playlist_map", JSON.stringify(playlistNameCache));
              setPlaylistPill(data.name);
              return;
            }
          }
        } catch (e) {}
      }

      // Layer 3: Public oEmbed lookup (resolves Daylist, Daily Mix, Release Radar, DJ, etc.)
      try {
        const oembedUrl = `https://open.spotify.com/oembed?url=${encodeURIComponent(`https://open.spotify.com/playlist/${playlistId}`)}`;
        const oRes = await fetch(oembedUrl);
        if (oRes.ok) {
          const oData = await oRes.json();
          if (oData && oData.title) {
            playlistNameCache[playlistId] = oData.title;
            localStorage.setItem("sp_playlist_map", JSON.stringify(playlistNameCache));
            setPlaylistPill(oData.title);
            return;
          }
        }
      } catch (e) {}

      // Layer 4: Keep previous known playlist name or show current album
      if (!lastPlaylistLabel && fallbackAlbum) {
        setPlaylistPill(fallbackAlbum);
      }
    }

    async function syncDeck() {
      const [player, qData] = await Promise.all([spFetch(""), spFetch("/queue")]);

      if (player) {
        if (player.device) {
          if (player.device.id) {
            lastDeviceId = player.device.id;
            localStorage.setItem("sp_last_device_id", lastDeviceId);
          }
          if (player.device.name) {
            lastDeviceName = player.device.name;
            localStorage.setItem("sp_last_device_name", lastDeviceName);
          }
        }
        if (player.context && player.context.uri) {
          lastContextUri = player.context.uri;
          localStorage.setItem("sp_last_context_uri", lastContextUri);
        }
        if (player.item) {
          lastTrackData = player;
          localStorage.setItem("sp_last_track", JSON.stringify(player));
        }
      } else if (lastTrackData) {
        lastTrackData.is_playing = false;
      }

      if (qData && Array.isArray(qData.queue) && qData.queue.length > 0) {
        cachedQueue = qData.queue;
        localStorage.setItem("sp_cached_queue", JSON.stringify(cachedQueue));
      }

      document.getElementById("devicePill").textContent = lastDeviceName;

      const activePlayer = (player && player.item) ? player : lastTrackData;

      if (activePlayer && activePlayer.item) {
        isPlaying = Boolean(player && player.is_playing);
        trackDuration = activePlayer.item.duration_ms || 1;
        currentProgress = activePlayer.progress_ms || 0;

        document.getElementById("title").textContent = activePlayer.item.name;
        document.getElementById("artist").textContent = activePlayer.item.artists.map(a => a.name).join(", ");
        document.getElementById("cover").src = activePlayer.item.album?.images?.[0]?.url || SPOTIFY_LOGO_SVG;
        document.getElementById("playBtn").textContent = isPlaying ? "Pause" : "Play";

        const pct = Math.min(100, (currentProgress / trackDuration) * 100);
        document.getElementById("progress").style.width = `${pct}%`;
        document.getElementById("timeDisplay").textContent = `${formatTime(currentProgress)} / ${formatTime(trackDuration)}`;

        const albumName = activePlayer.item.album?.name || "Spotify";
        const activeContextUri = activePlayer.context?.uri || lastContextUri;
        const activeContextHref = activePlayer.context?.href || null;

        if (activeContextUri) {
          // Regex handles both spotify:playlist:ID and legacy spotify:user:xxx:playlist:ID
          const plMatch = activeContextUri.match(/playlist[:\/]([a-zA-Z0-9]+)/);
          if (plMatch && plMatch[1]) {
            resolvePlaylistName(plMatch[1], activeContextHref, albumName);
          } else if (activeContextUri.includes(":collection")) {
            setPlaylistPill("Liked Songs");
          } else if (activeContextUri.includes(":album:")) {
            setPlaylistPill(albumName);
          } else if (activeContextUri.includes(":artist:")) {
            setPlaylistPill(`${activePlayer.item.artists[0]?.name || "Artist"} Radio`);
          } else if (!lastPlaylistLabel) {
            setPlaylistPill(albumName);
          }
        } else if (!lastPlaylistLabel) {
          setPlaylistPill(albumName);
        }
      } else {
        document.getElementById("cover").src = SPOTIFY_LOGO_SVG;
      }

      const queueToRender = (qData && Array.isArray(qData.queue) && qData.queue.length > 0) ? qData.queue : cachedQueue;
      if (queueToRender && queueToRender.length > 0) {
        const next5 = queueToRender.slice(0, 5);
        document.getElementById("queue").innerHTML = next5.map((t, i) => `
          <div class="q-item" onclick="playQueueTrack('${t.uri}')" title="Click to play">
            <div class="q-left">
              <span class="q-num">${i + 1}</span>
              <span class="q-name">${t.name}</span>
            </div>
            <span class="q-artist">${t.artists?.[0]?.name || ""}</span>
          </div>
        `).join("");
      }
    }

    async function getTargetDeviceId(token) {
      try {
        const res = await fetch("https://api.spotify.com/v1/me/player/devices", {
          headers: { Authorization: `Bearer ${token}` }
        });
        if (res.ok) {
          const data = await res.json();
          const devices = data.devices || [];
          const active = devices.find(d => d.is_active);
          if (active) return active.id;
          const matchedId = devices.find(d => d.id === lastDeviceId);
          if (matchedId) return matchedId.id;
          const matchedName = devices.find(d => d.name === lastDeviceName);
          if (matchedName) return matchedName.id;
          if (devices.length > 0) return devices[0].id;
        }
      } catch (e) {}
      return lastDeviceId;
    }

    async function togglePlay() {
      const token = await refreshTokenIfNeeded();
      if (!token) return;

      if (isPlaying) {
        await fetch("https://api.spotify.com/v1/me/player/pause", {
          method: "PUT",
          headers: { Authorization: `Bearer ${token}` }
        });
        isPlaying = false;
        document.getElementById("playBtn").textContent = "Play";
        setTimeout(syncDeck, 300);
        return;
      }

      let res = await fetch("https://api.spotify.com/v1/me/player/play", {
        method: "PUT",
        headers: { Authorization: `Bearer ${token}` }
      });

      if (!res.ok && lastTrackData && lastTrackData.item) {
        const devId = await getTargetDeviceId(token);
        const query = devId ? `?device_id=${devId}` : "";
        const fallbackUris = [
          lastTrackData.item.uri,
          ...(cachedQueue || []).slice(0, 10).map(t => t.uri)
        ].filter(Boolean);

        await fetch(`https://api.spotify.com/v1/me/player/play${query}`, {
          method: "PUT",
          headers: {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            uris: fallbackUris,
            position_ms: currentProgress || 0
          })
        });
      }

      setTimeout(syncDeck, 350);
    }

    async function skipTrack() {
      const token = await refreshTokenIfNeeded();
      if (!token) return;
      const res = await fetch("https://api.spotify.com/v1/me/player/next", {
        method: "POST",
        headers: { Authorization: `Bearer ${token}` }
      });
      if (!res.ok && cachedQueue && cachedQueue.length > 0) {
        await playQueueTrack(cachedQueue[0].uri);
        return;
      }
      setTimeout(syncDeck, 400);
    }

    async function playQueueTrack(trackUri) {
      const token = await refreshTokenIfNeeded();
      if (!token) return;
      const devId = await getTargetDeviceId(token);
      const query = devId ? `?device_id=${devId}` : "";

      // Try jumping inside the active playlist context first so Spotify doesn't wipe player.context
      if (lastContextUri && (lastContextUri.includes(":playlist:") || lastContextUri.includes(":album:"))) {
        const ctxRes = await fetch(`https://api.spotify.com/v1/me/player/play${query}`, {
          method: "PUT",
          headers: {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            context_uri: lastContextUri,
            offset: { uri: trackUri }
          })
        });
        if (ctxRes.ok) {
          setTimeout(syncDeck, 400);
          return;
        }
      }

      // Fallback if track was manually queued outside the playlist
      let urisToPlay = [trackUri];
      if (cachedQueue && cachedQueue.length > 0) {
        const idx = cachedQueue.findIndex(t => t.uri === trackUri);
        if (idx !== -1) {
          urisToPlay = cachedQueue.slice(idx, idx + 15).map(t => t.uri);
        }
      }

      await fetch(`https://api.spotify.com/v1/me/player/play${query}`, {
        method: "PUT",
        headers: { 
          Authorization: `Bearer ${token}`,
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ uris: urisToPlay })
      });
      setTimeout(syncDeck, 400);
    }

    async function scrubTrack(event) {
      if (!trackDuration) return;
      const rect = document.getElementById("progressTrack").getBoundingClientRect();
      const clickX = event.clientX - rect.left;
      const width = rect.width;
      const percent = Math.max(0, Math.min(1, clickX / width));
      const targetMs = Math.floor(trackDuration * percent);

      currentProgress = targetMs;
      if (lastTrackData) {
        lastTrackData.progress_ms = targetMs;
        localStorage.setItem("sp_last_track", JSON.stringify(lastTrackData));
      }
      document.getElementById("progress").style.width = `${percent * 100}%`;
      document.getElementById("timeDisplay").textContent = `${formatTime(targetMs)} / ${formatTime(trackDuration)}`;

      const token = await refreshTokenIfNeeded();
      if (!token) return;
      await fetch(`https://api.spotify.com/v1/me/player/seek?position_ms=${targetMs}`, {
        method: "PUT",
        headers: { Authorization: `Bearer ${token}` }
      });
      setTimeout(syncDeck, 250);
    }

    async function keepSessionAlive() {
      if (isPlaying || !lastDeviceId) return;
      const token = await refreshTokenIfNeeded();
      if (!token) return;
      try {
        await fetch("https://api.spotify.com/v1/me/player", {
          method: "PUT",
          headers: {
            Authorization: `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ device_ids: [lastDeviceId], play: false })
        });
      } catch (e) {}
    }

    function popOut() {
      // Cache-busting query string ensures the popup window loads the latest deployment
      const bustUrl = `${window.location.origin}${window.location.pathname}?v=${Date.now()}`;
      window.open(bustUrl, "SpotifyMiniDeck", "width=400,height=300,menubar=no,toolbar=no,location=no,status=no,resizable=no");
    }

    async function bootSpotify() {
      const params = new URLSearchParams(window.location.search);
      if (params.has("code")) {
        await exchangeCode(params.get("code"));
      }
      const token = await refreshTokenIfNeeded();
      if (!token) {
        document.getElementById("loginScreen").classList.remove("hidden");
      } else {
        document.getElementById("loginScreen").classList.add("hidden");
        await preloadUserPlaylists();
        syncDeck();
        setInterval(syncDeck, 3000);
        setInterval(keepSessionAlive, 45000);
      }
    }

    bootSpotify();
  </script>
</body>
